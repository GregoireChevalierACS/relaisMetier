name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Mêmes requêtes et mêmes fichiers que l'analyse locale (pnpm securite).
          config-file: ./.github/codeql/codeql-config.yml
          # Même version que l'analyse locale (ADR 0006) : à monter des deux côtés ensemble.
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.6/codeql-bundle-linux64.tar.gz

      - uses: github/codeql-action/analyze@v4
