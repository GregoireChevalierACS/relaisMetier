name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle exécution sur la même branche annule la précédente, devenue obsolète.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    name: Vérification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL_DE_LA_BASE_DE_TEST: postgres://postgres:test@127.0.0.1:5433/postgres
    # Base jetable pour les tests du journal PostgreSQL (contrat, migrations).
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Tout l'historique : nécessaire pour vérifier chaque commit de la PR.
          fetch-depth: 0
          # mailHelper et FindAndFill font partie du workspace pnpm (ADR 0002).
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installation reproductible
        run: pnpm install --frozen-lockfile

      - name: Audit des dépendances
        run: pnpm audit --audit-level high

      # Exception documentée : un bot ne connaît pas le numéro de commit du jour. L'exception repose
      # sur l'auteur de la PR fourni par GitHub, pas sur le message, qui serait falsifiable.
      - name: Format des commits
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: pnpm commits:check ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Lint
        run: pnpm lint

      - name: Architecture
        run: pnpm lint:architecture

      - name: Formatage
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Tests et couverture
        run: pnpm test:coverage

      - name: Build de production
        run: pnpm build

      # Critère de la phase 1 : la même graine redonne exactement les mêmes fichiers.
      - name: Jeu synthétique reproductible
        run: |
          pnpm generer:jeu --graine 42 --sortie "$RUNNER_TEMP/jeu-a"
          pnpm generer:jeu --graine 42 --sortie "$RUNNER_TEMP/jeu-b"
          diff -r "$RUNNER_TEMP/jeu-a" "$RUNNER_TEMP/jeu-b"

      - name: Test de mutation
        run: pnpm test:mutation

      - name: Rapport de mutation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rapport-mutation
          path: packages/domain/reports/mutation/
          if-no-files-found: ignore

  pile:
    name: Workflows n8n, smoke test et jeu synthétique
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installation reproductible
        run: pnpm install --frozen-lockfile

      - name: Configuration de test (secrets aléatoires)
        run: pnpm env:creer

      # Le jeu est chargé avant le smoke test : le relevé est vérifié sur de vrais courriels. Le
      # chargement vérifie lui-même que chaque boîte contient le nombre attendu de courriels.
      - name: Chargement du jeu synthétique dans GreenMail
        run: |
          docker compose up --detach --wait greenmail
          pnpm generer:jeu
          pnpm jeu:charger

      # Pile neuve : chaque workflow versionné doit s'importer dans un n8n vierge ; « Vérifier le
      # service » doit obtenir GET /sante → 200, et « Relever les boîtes » être idempotent.
      - name: Import des workflows et smoke test
        run: pnpm smoke

      - name: Journaux de la pile
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêt de la pile
        if: always()
        run: docker compose down --volumes
