version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      outillage:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8 ne supporte que TypeScript < 6.1 (voir docs/adr/0003).
      - dependency-name: typescript
        versions: ['>=6.1.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Images de compose.yaml (n8n, PostgreSQL, GreenMail) : une montée de n8n se relit avec ses notes
  # de version, puisqu'elle peut changer le format des workflows exportés.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/service
    schedule:
      interval: weekly

  # mailHelper et FindAndFill : chaque nouvelle version arrive en PR et passe la CI complète.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
